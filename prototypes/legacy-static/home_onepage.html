<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaihuCasino OnePage Home</title>
  <style>
    :root {
      --bg: #070f13;
      --bg-deep: #04080a;
      --ink: #f5eddc;
      --muted: #9eb0b5;
      --accent: #d9b97b;
      --accent-rgb: 217, 185, 123;
      --line: rgba(217, 185, 123, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 700px at 12% 0%, #1d4f48 0%, transparent 58%),
        radial-gradient(900px 700px at 100% 0%, #5a301b 0%, transparent 55%),
        linear-gradient(180deg, var(--bg), var(--bg-deep) 72%);
    }

    .app {
      width: min(100vw, 1720px);
      height: 100dvh;
      max-height: 100dvh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: 74px 1fr;
      padding: 12px 16px 14px;
      gap: 10px;
      overflow: hidden;
    }

    .topbar {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      background: rgba(6, 10, 12, 0.52);
      backdrop-filter: blur(10px);
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      padding: 8px 10px;
      min-height: 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
      min-width: 0;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      color: var(--accent);
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.12);
      flex: 0 0 auto;
    }

    .brand-text {
      min-width: 0;
      overflow: hidden;
    }

    .brand-text b {
      display: block;
      letter-spacing: 0.03em;
      font-size: 16px;
      line-height: 1;
    }

    .brand-text span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-row {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }

    .status-chip {
      min-width: 112px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 6px 10px;
    }

    .status-chip i {
      display: block;
      font-style: normal;
      color: var(--muted);
      font-size: 11px;
      line-height: 1;
    }

    .status-chip b {
      display: block;
      margin-top: 4px;
      font-size: 16px;
      line-height: 1;
      letter-spacing: 0.01em;
    }

    .layout {
      min-height: 0;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr) 370px;
      gap: 10px;
      overflow: hidden;
    }

    .panel {
      min-height: 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(7, 12, 14, 0.58);
      border-radius: 16px;
      overflow: hidden;
    }

    .rail {
      padding: 10px;
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .rail-btn {
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.03);
      color: var(--ink);
      text-align: left;
      padding: 10px 10px 10px 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
      transition: 0.16s ease;
    }

    .rail-btn:hover {
      border-color: var(--line);
      background: rgba(var(--accent-rgb), 0.12);
      transform: translateX(2px);
    }

    .stage {
      position: relative;
      min-height: 0;
      border-radius: 16px;
      border: 1px solid var(--line);
      background:
        radial-gradient(circle at center, rgba(28, 87, 79, 0.52), rgba(8, 15, 18, 0.94) 64%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0));
      overflow: hidden;
    }

    .stage::before {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      right: -130px;
      bottom: -170px;
      border-radius: 50%;
      background: radial-gradient(circle at center, rgba(var(--accent-rgb), 0.3), transparent 70%);
      pointer-events: none;
    }

    .wheel-wrap {
      position: absolute;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%);
      width: min(70vmin, 640px);
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
    }

    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background:
        repeating-conic-gradient(
          from 0deg,
          rgba(217, 185, 123, 0.24) 0deg 9deg,
          rgba(255, 255, 255, 0.05) 9deg 18deg
        );
      animation: spin 18s linear infinite;
      position: relative;
    }

    .wheel::after {
      content: "";
      position: absolute;
      inset: 16%;
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.18);
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0));
    }

    .hub {
      position: absolute;
      width: 34%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(7, 12, 14, 0.75);
      display: grid;
      place-content: center;
      text-align: center;
      box-shadow: 0 0 0 4px rgba(var(--accent-rgb), 0.12);
      pointer-events: none;
    }

    .hub i {
      font-style: normal;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 11px;
      line-height: 1;
    }

    .hub b {
      margin-top: 8px;
      font-size: clamp(24px, 4.4vmin, 48px);
      line-height: 1;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .games {
      padding: 10px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      min-height: 0;
    }

    .games-title {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      padding-left: 2px;
    }

    .game-list {
      min-height: 0;
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .game-btn {
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.03);
      color: var(--ink);
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      clip-path: polygon(0 0, 88% 0, 100% 50%, 88% 100%, 0 100%, 8% 50%);
      transition: 0.15s ease;
    }

    .game-btn strong {
      display: block;
      font-size: 20px;
      line-height: 1;
      letter-spacing: 0.01em;
    }

    .game-btn span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
    }

    .game-btn:hover,
    .game-btn.active {
      border-color: var(--line);
      background: rgba(var(--accent-rgb), 0.12);
      transform: translateX(-2px);
    }

    .go-wrap {
      display: grid;
      gap: 8px;
    }

    .go-main {
      width: 100%;
      border: 1px solid rgba(var(--accent-rgb), 0.9);
      color: #261707;
      background: linear-gradient(180deg, #f0d296, #d8a95c);
      font-weight: 800;
      letter-spacing: 0.02em;
      padding: 12px 14px;
      cursor: pointer;
      clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%);
    }

    .go-sub {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.03);
      color: var(--ink);
      font-weight: 700;
      padding: 10px 12px;
      cursor: pointer;
    }

    .go-main:hover, .go-sub:hover { filter: brightness(1.06); }

    .foot {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 10px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      pointer-events: none;
    }

    @media (max-width: 1180px) {
      .layout {
        grid-template-columns: 180px minmax(0, 1fr) 300px;
      }
      .game-btn strong { font-size: 18px; }
    }

    @media (max-width: 940px) {
      .app { padding: 10px; grid-template-rows: 66px 1fr; }
      .layout { grid-template-columns: 1fr; }
      .rail { display: none; }
      .games { grid-template-rows: auto auto auto; }
      .game-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stage { min-height: 52vh; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="./home_onepage.html">
        <div class="brand-mark">T</div>
        <div class="brand-text">
          <b>TaihuCasino</b>
          <span id="selectedHint">当前推荐：轮盘</span>
        </div>
      </a>
      <div class="status-row">
        <div class="status-chip">
          <i>Balance</i>
          <b id="balance">1,358,600</b>
        </div>
        <div class="status-chip">
          <i>Streak</i>
          <b id="streak">6</b>
        </div>
      </div>
    </header>

    <div class="layout">
      <aside class="panel rail">
        <button class="rail-btn" id="memberBtn">会员中心</button>
        <button class="rail-btn" id="shopBtn">补给商店</button>
        <button class="rail-btn" id="eventBtn">巡回吧台</button>
      </aside>

      <section class="stage">
        <div class="wheel-wrap">
          <div class="wheel"></div>
          <div class="hub">
            <i>Hot Table</i>
            <b id="hotName">轮盘</b>
          </div>
        </div>
        <div class="foot">
          <span id="sessionInfo">Session R-02</span>
          <span id="clock">00:00:00</span>
        </div>
      </section>

      <aside class="panel games">
        <div class="games-title">Select Table</div>
        <div class="game-list" id="gameList"></div>
        <div class="go-wrap">
          <button class="go-main" id="startBtn">立即开局</button>
          <button class="go-sub" id="resumeBtn">继续上局</button>
        </div>
      </aside>
    </div>
  </div>

  <script>
    (() => {
      const games = [
        { id: "roulette", name: "轮盘", en: "Roulette", href: "./pages/roulette.html", accent: "#d9b97b", session: "R-02" },
        { id: "baccarat", name: "百家乐", en: "Baccarat", href: "./pages/baccarat.html", accent: "#4cc3b6", session: "B-01" },
        { id: "blackjack", name: "21点", en: "Blackjack", href: "./pages/blackjack.html", accent: "#7fa6ff", session: "J-04" },
        { id: "dice", name: "骰子", en: "Dice", href: "./pages/dice.html", accent: "#e7837e", session: "D-07" }
      ];

      const gameList = document.getElementById("gameList");
      const hotName = document.getElementById("hotName");
      const selectedHint = document.getElementById("selectedHint");
      const sessionInfo = document.getElementById("sessionInfo");
      const startBtn = document.getElementById("startBtn");
      const resumeBtn = document.getElementById("resumeBtn");

      const balanceEl = document.getElementById("balance");
      const streakEl = document.getElementById("streak");
      const clockEl = document.getElementById("clock");

      let selected = games[0];
      let balance = 1358600;
      let streak = 6;

      function setAccent(hex) {
        document.documentElement.style.setProperty("--accent", hex);
        const rgb = hex.replace("#", "");
        const toRgb = [
          parseInt(rgb.slice(0, 2), 16),
          parseInt(rgb.slice(2, 4), 16),
          parseInt(rgb.slice(4, 6), 16)
        ];
        document.documentElement.style.setProperty("--accent-rgb", toRgb.join(", "));
      }

      function updateSelected(game) {
        selected = game;
        hotName.textContent = game.name;
        selectedHint.textContent = `当前推荐：${game.name}`;
        sessionInfo.textContent = `Session ${game.session}`;
        setAccent(game.accent);

        [...gameList.querySelectorAll(".game-btn")].forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.id === game.id);
        });
      }

      games.forEach((game) => {
        const btn = document.createElement("button");
        btn.className = "game-btn";
        btn.dataset.id = game.id;
        btn.innerHTML = `<strong>${game.name}</strong><span>${game.en}</span>`;
        btn.addEventListener("click", () => updateSelected(game));
        gameList.appendChild(btn);
      });

      startBtn.addEventListener("click", () => { window.location.href = selected.href; });
      resumeBtn.addEventListener("click", () => { window.location.href = selected.href; });

      document.getElementById("memberBtn").addEventListener("click", () => {
        window.location.href = "./pages/member-counter.html";
      });
      document.getElementById("shopBtn").addEventListener("click", () => {
        window.location.href = "./pages/cocktail-bar.html";
      });
      document.getElementById("eventBtn").addEventListener("click", () => {
        window.location.href = "./pages/casino-cocktail-service.html";
      });

      setInterval(() => {
        const delta = Math.floor((Math.random() - 0.46) * 1600);
        balance = Math.max(0, balance + delta);
        if (Math.random() > 0.73) streak = Math.max(0, streak + (Math.random() > 0.35 ? 1 : -1));
        balanceEl.textContent = balance.toLocaleString("en-US");
        streakEl.textContent = String(streak);
      }, 1400);

      setInterval(() => {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, "0");
        const mm = String(now.getMinutes()).padStart(2, "0");
        const ss = String(now.getSeconds()).padStart(2, "0");
        clockEl.textContent = `${hh}:${mm}:${ss}`;
      }, 1000);

      updateSelected(games[0]);
    })();
  </script>
</body>
</html>
