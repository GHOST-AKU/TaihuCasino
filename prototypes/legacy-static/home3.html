<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaihuCasino Home 3</title>
  <link rel="stylesheet" href="./assets/css/home3.css" />
</head>
<body>
  <div class="home3-shell">
    <header class="topbar" aria-label="大厅状态栏">
      <div class="topbar__group">
        <a class="icon-pill" href="./pages/member-counter.html" aria-label="消息中心">
          <span class="icon icon--mail"></span>
        </a>
        <a class="profile-pill" href="./pages/member-counter.html">
          <span class="icon icon--user"></span>
          <span class="profile-pill__name">Howayyoung</span>
        </a>
        <a class="vip-pill" href="./pages/member-counter.html">
          <span class="vip-pill__mark">VIP 10</span>
          <span class="vip-pill__arrow">&gt;</span>
        </a>
      </div>

      <div class="topbar__group topbar__group--right">
        <div class="coin-pill" aria-label="当前筹码">
          <span class="coin-pill__coin"></span>
          <strong>13,580,600</strong>
          <span class="coin-pill__plus">+</span>
        </div>
        <button class="icon-pill icon-pill--menu" type="button" aria-label="更多菜单">
          <span class="icon icon--grid"></span>
        </button>
      </div>
    </header>

    <main class="stage">
      <section class="brand-stage" aria-labelledby="brand-title">
        <div class="brand-stage__glow" aria-hidden="true"></div>
        <p class="brand-stage__spark" aria-hidden="true">✦ ✦ ✦</p>
        <h1 id="brand-title">Taihu</h1>
        <p class="brand-stage__sub">CASINO</p>
      </section>

      <section class="game-grid" aria-label="主线玩法">
        <a class="game-card game-card--green" href="./pages/roulette.html">
          <div class="game-card__art game-card__art--deck" aria-hidden="true">
            <span class="chip chip--dark"></span>
            <span class="chip chip--red"></span>
            <span class="chip chip--light"></span>
            <span class="card-stack card-stack--left"></span>
            <span class="card-stack card-stack--right"></span>
            <span class="dice"></span>
          </div>
          <h2>Roulette</h2>
        </a>

        <a class="game-card game-card--gold" href="./pages/baccarat.html">
          <div class="game-card__art game-card__art--trio" aria-hidden="true">
            <span class="playing-card playing-card--a"></span>
            <span class="playing-card playing-card--heart"></span>
            <span class="playing-card playing-card--face"></span>
            <span class="chip chip--gold"></span>
            <span class="chip chip--red"></span>
            <span class="coin-pile"></span>
          </div>
          <h2>Baccarat</h2>
        </a>

        <a class="game-card game-card--ink" href="./pages/blackjack.html">
          <div class="game-card__art game-card__art--blackjack" aria-hidden="true">
            <span class="playing-card playing-card--a-left"></span>
            <span class="playing-card playing-card--a-right"></span>
            <span class="playing-card playing-card--spade"></span>
            <span class="chip chip--dark"></span>
            <span class="chip chip--red"></span>
          </div>
          <h2>Blackjack</h2>
        </a>

        <a class="game-card game-card--rose" href="./pages/dice.html">
          <div class="game-card__art game-card__art--baccarat" aria-hidden="true">
            <span class="playing-card playing-card--nine"></span>
            <span class="playing-card playing-card--six"></span>
            <span class="playing-card playing-card--mini"></span>
            <span class="chip chip--green"></span>
            <span class="chip chip--red"></span>
            <span class="coin-pile coin-pile--small"></span>
          </div>
          <h2>Dice</h2>
        </a>
      </section>

      <nav class="feature-nav" aria-label="大厅功能">
        <a class="feature-link" href="./pages/cocktail-bar.html">
          <span class="feature-link__icon feature-link__icon--shop"></span>
          <span>Shop</span>
        </a>
        <a class="feature-link" href="./pages/casino-cocktail-service.html">
          <span class="feature-link__icon feature-link__icon--event"></span>
          <span>Event</span>
        </a>
        <a class="feature-link" href="./pages/member-counter.html">
          <span class="feature-link__icon feature-link__icon--mission"></span>
          <span>Mission</span>
        </a>
        <a class="feature-link" href="./pages/member-counter.html">
          <span class="feature-link__icon feature-link__icon--bonus"></span>
          <span>Bonus</span>
        </a>
      </nav>
    </main>
  </div>
</body>
</html>
