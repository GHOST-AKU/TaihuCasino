<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaihuCasino Material Vercel Style</title>
  <style>
    :root {
      --bg: #fafafa;
      --card: #ffffff;
      --ink: #111111;
      --muted: #666666;
      --line: #eaeaea;
      --accent: #111111;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Geist", "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: radial-gradient(1200px 500px at 0% -10%, #f0f5ff 0%, transparent 60%), var(--bg);
    }
    .shell { max-width: 1180px; margin: 0 auto; padding: 20px 14px 30px; }
    .hero {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px;
      background: linear-gradient(140deg, #ffffff 0%, #f7f7f7 100%);
      box-shadow: 0 8px 24px rgba(0,0,0,.04);
    }
    .eyebrow {
      margin: 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      font-weight: 700;
    }
    h1 {
      margin: 8px 0 10px;
      font-size: clamp(30px, 4.2vw, 54px);
      line-height: 1.05;
      letter-spacing: -.02em;
    }
    .lead {
      margin: 0 0 16px;
      max-width: 700px;
      color: var(--muted);
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 160px;
      text-decoration: none;
      font-weight: 600;
      border-radius: 12px;
      padding: 11px 14px;
      border: 1px solid var(--line);
      color: var(--ink);
      background: #fff;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn:hover { filter: brightness(.98); }
    .grid {
      margin-top: 14px;
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      background: var(--card);
      text-decoration: none;
      color: inherit;
      transition: transform .15s ease, border-color .15s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #d9d9d9;
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 700;
    }
    .card h3 {
      margin: 9px 0 6px;
      font-size: 22px;
      letter-spacing: -.01em;
    }
    .card p { margin: 0; color: var(--muted); }
    .panel {
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      background: #fff;
      color: var(--muted);
    }
    @media (max-width: 980px) { .grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <p class="eyebrow">Vercel Inspired</p>
      <h1>Material 页 Vercel 版</h1>
      <p class="lead">这版用更克制的排版、留白和边框体系，走 Vercel 风格的干净产品化视觉，不再走花哨赌场风格。</p>
      <div class="actions">
        <a class="btn btn-primary" href="./pages/roulette_openui.html">进入轮盘</a>
        <a class="btn" href="./home_Material_figma.html">对比 Figma 版</a>
        <a class="btn" href="./home_Material.html">对比原文件</a>
      </div>
    </section>

    <section class="grid">
      <a class="card" href="./pages/roulette_openui.html"><div class="meta">Primary Entry</div><h3>Roulette</h3><p>最快开始一局。</p></a>
      <a class="card" href="./pages/baccarat.html"><div class="meta">Main Table</div><h3>Baccarat</h3><p>继续主线进度。</p></a>
      <a class="card" href="./pages/blackjack.html"><div class="meta">Strategy</div><h3>Blackjack</h3><p>偏思考型玩法。</p></a>
      <a class="card" href="./pages/dice.html"><div class="meta">Quick Round</div><h3>Dice</h3><p>短局轻量体验。</p></a>
    </section>

    <section class="panel">
      Vercel 风格重点不是图案，而是布局秩序、排版节奏和交互一致性。这个方向后续适合整站统一。
    </section>
  </div>
</body>
</html>
