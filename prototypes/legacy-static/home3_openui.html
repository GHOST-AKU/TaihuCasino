<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaihuCasino Home3 OpenUI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" />
  <style>
    :root {
      --bg: #070b0f;
      --ink: #fff2db;
      --muted: #c5b99f;
      --gold: #e7bf78;
      --rose: #d36b86;
      --jade: #149b90;
    }
    body {
      margin: 0;
      color: var(--ink);
      min-height: 100vh;
      background:
        radial-gradient(900px 560px at 8% 0%, #153c35 0%, transparent 56%),
        radial-gradient(950px 580px at 92% 0%, #4c2b18 0%, transparent 57%),
        linear-gradient(180deg, var(--bg), #030507 72%);
    }
    .shell { max-width: 1260px; margin: 0 auto; padding: 18px 14px 26px; }
    .top {
      border-radius: 20px;
      border: 1px solid rgba(231,191,120,.38);
      background: linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
      padding: 18px;
      box-shadow: 0 18px 42px rgba(0,0,0,.4);
    }
    .label {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .title {
      margin: 7px 0 6px;
      font-size: clamp(30px, 4.5vw, 52px);
      line-height: 1.04;
    }
    .lead { color: var(--muted); margin: 0 0 12px; }
    .cards { margin-top: 14px; }
    .cardx {
      display: block;
      text-decoration: none;
      color: var(--ink);
      border-radius: 16px;
      border: 1px solid rgba(231,191,120,.3);
      min-height: 170px;
      padding: 14px;
      background: linear-gradient(155deg, rgba(255,255,255,.06), rgba(255,255,255,.01));
      transition: .2s ease;
    }
    .cardx:hover {
      transform: translateY(-2px);
      border-color: rgba(231,191,120,.8);
      color: #fff;
    }
    .cardx--jade:hover { background: linear-gradient(160deg, rgba(20,155,144,.28), rgba(20,155,144,.06)); }
    .cardx--gold:hover { background: linear-gradient(160deg, rgba(231,191,120,.28), rgba(231,191,120,.06)); }
    .cardx--ink:hover { background: linear-gradient(160deg, rgba(123,132,149,.28), rgba(123,132,149,.06)); }
    .cardx--rose:hover { background: linear-gradient(160deg, rgba(211,107,134,.3), rgba(211,107,134,.08)); }
    .k { color: var(--gold); font-size: 12px; letter-spacing: .08em; font-weight: 700; }
    .cardx h3 { margin: 6px 0; font-size: 22px; }
    .cardx p { margin: 0; color: var(--muted); font-size: 14px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .icon {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }
    .icon-tile {
      width: 24px;
      height: 24px;
      color: var(--gold);
    }
    .cardx-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <p class="label">Home3 Base · OpenUI</p>
      <h1 class="title">Home3 视觉重构版</h1>
      <p class="lead">入口图案改为现成开源 SVG 图标，避免 CSS 手绘图案导致的质感不稳定。</p>
      <div class="d-flex gap-2 flex-wrap">
        <a class="btn btn-amber" href="./pages/roulette_openui.html">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 3v18"></path><path d="M3 12h18"></path></svg>
          打开新轮盘
        </a>
        <a class="btn btn-outline-light" href="./home3.html">
          <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14"></path><path d="M5 12l4 4"></path><path d="M5 12l4 -4"></path></svg>
          对比原 home3
        </a>
        <a class="btn btn-outline-warning" href="./home_Material_openui.html">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg>
          看 Material 改造版
        </a>
      </div>
    </header>

    <section class="row g-3 cards">
      <div class="col-12 col-md-6">
        <a class="cardx cardx--jade" href="./pages/roulette_openui.html">
          <div class="cardx-head">
            <div class="k">FAST ENTRY</div>
            <svg class="icon icon-tile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 3v18"></path><path d="M3 12h18"></path><path d="M7 7l10 10"></path><path d="M17 7l-10 10"></path></svg>
          </div>
          <h3>Roulette</h3>
          <p>最快开始一局，适合作为默认入口。</p>
        </a>
      </div>
      <div class="col-12 col-md-6">
        <a class="cardx cardx--gold" href="./pages/baccarat.html">
          <div class="cardx-head">
            <div class="k">MAIN LINE</div>
            <svg class="icon icon-tile" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M8 9h.01"></path><path d="M12 9h.01"></path><path d="M16 9h.01"></path><path d="M8 13h.01"></path><path d="M12 13h.01"></path><path d="M16 13h.01"></path></svg>
          </div>
          <h3>Baccarat</h3>
          <p>继续主线推进，承接当前进度。</p>
        </a>
      </div>
      <div class="col-12 col-md-6">
        <a class="cardx cardx--ink" href="./pages/blackjack.html">
          <div class="cardx-head">
            <div class="k">THINKING MODE</div>
            <svg class="icon icon-tile" viewBox="0 0 24 24"><rect x="5" y="4" width="10" height="14" rx="2"></rect><path d="M9 8l2 2l2 -2"></path><path d="M14 9h5"></path><path d="M14 13h5"></path></svg>
          </div>
          <h3>Blackjack</h3>
          <p>更偏策略节奏的长局选择。</p>
        </a>
      </div>
      <div class="col-12 col-md-6">
        <a class="cardx cardx--rose" href="./pages/dice.html">
          <div class="cardx-head">
            <div class="k">SHORT ROUND</div>
            <svg class="icon icon-tile" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M9 9h.01"></path><path d="M15 9h.01"></path><path d="M9 15h.01"></path><path d="M15 15h.01"></path></svg>
          </div>
          <h3>Dice</h3>
          <p>短局、轻量、快速切换。</p>
        </a>
      </div>
    </section>
  </div>
</body>
</html>
