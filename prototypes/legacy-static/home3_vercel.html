<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaihuCasino Home3 Vercel Style</title>
  <style>
    :root {
      --bg: #fcfcfc;
      --ink: #111111;
      --muted: #666666;
      --line: #ebebeb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Geist", "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    .layout {
      max-width: 1220px;
      margin: 0 auto;
      padding: 14px;
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 14px;
    }
    .side {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: #fff;
      min-height: calc(100vh - 28px);
      position: sticky;
      top: 14px;
    }
    .side h2 {
      margin: 4px 0 12px;
      font-size: 18px;
      letter-spacing: -.01em;
    }
    .side a {
      display: block;
      text-decoration: none;
      color: var(--muted);
      border-radius: 10px;
      padding: 9px 10px;
      margin-bottom: 6px;
      border: 1px solid transparent;
    }
    .side a:hover {
      color: var(--ink);
      border-color: var(--line);
      background: #fafafa;
    }
    .main .hero {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      background: #fff;
    }
    .hero .tag {
      display: inline-block;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .hero h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 48px);
      letter-spacing: -.02em;
      line-height: 1.06;
    }
    .hero p {
      margin: 0 0 12px;
      color: var(--muted);
      max-width: 700px;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 10px 13px;
      color: var(--ink);
      background: #fff;
      font-weight: 600;
    }
    .btn-primary {
      background: #111;
      border-color: #111;
      color: #fff;
    }
    .cards {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      padding: 13px;
      text-decoration: none;
      color: inherit;
      min-height: 148px;
      transition: transform .14s ease, border-color .14s ease;
    }
    .card:hover { transform: translateY(-2px); border-color: #dddddd; }
    .card .k {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .card h3 {
      margin: 8px 0 6px;
      font-size: 22px;
      letter-spacing: -.01em;
    }
    .card p { margin: 0; color: var(--muted); }
    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
      .side { min-height: auto; position: static; }
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="side">
      <h2>TaihuCasino</h2>
      <a href="./home3_vercel.html">Home3 Vercel 当前页</a>
      <a href="./home3_figma.html">对比 Figma 版</a>
      <a href="./home3_openui.html">对比 OpenUI 版</a>
      <a href="./home3.html">对比原 home3</a>
      <a href="./pages/member-counter.html">会员中心</a>
    </aside>

    <main class="main">
      <section class="hero">
        <span class="tag">Vercel Inspired</span>
        <h1>Home3 Vercel 版布局</h1>
        <p>这版走纯产品化信息架构，不强调装饰。侧栏导航 + 主内容卡片，能直接扩展成真实业务后台。</p>
        <div class="actions">
          <a class="btn btn-primary" href="./pages/roulette_openui.html">进入轮盘</a>
          <a class="btn" href="./home_Material_vercel.html">看 Material Vercel 版</a>
        </div>
      </section>

      <section class="cards">
        <a class="card" href="./pages/roulette_openui.html"><div class="k">Primary Entry</div><h3>Roulette</h3><p>推荐第一局入口。</p></a>
        <a class="card" href="./pages/baccarat.html"><div class="k">Main Table</div><h3>Baccarat</h3><p>继续主线玩法。</p></a>
        <a class="card" href="./pages/blackjack.html"><div class="k">Strategy</div><h3>Blackjack</h3><p>更偏策略节奏。</p></a>
        <a class="card" href="./pages/dice.html"><div class="k">Quick Round</div><h3>Dice</h3><p>短局切换。</p></a>
      </section>
    </main>
  </div>
</body>
</html>
